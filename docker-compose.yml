services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - postgres:/var/lib/postgresql/data

  moodle:
    image: ghcr.io/mdmourao/moodle-deisi:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - postgres
      - jobe
    ports:
      - "80:8080"
    environment:
      SITE_URL: ${SITE_URL:-http://localhost}
      SSLPROXY: ${SSLPROXY:-false}
      REVERSEPROXY: ${REVERSEPROXY:-false}
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: admin
      JOBE_HOST: jobe
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html

  # Runs CodeRunner code (Node.js + jsdom). Not exposed outside the compose network.
  jobe:
    image: ghcr.io/mdmourao/moodle-deisi-jobe:latest
    pull_policy: always
    platform: linux/amd64
    restart: unless-stopped

volumes:
  postgres:
  moodledata:
  moodlehtml:
