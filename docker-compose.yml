services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - postgres:/var/lib/postgresql/data

  moodle:
    image: ghcr.io/mdmourao/moodle-deisi:latest
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "80:8080"
    environment:
      SITE_URL: ${SITE_URL:-http://localhost}
      SSLPROXY: ${SSLPROXY:-false}
      DB_TYPE: pgsql
      DB_HOST: postgres
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: PLEASE_CHANGEME
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html

volumes:
  postgres:
  moodledata:
  moodlehtml:
